# ══════════════════════════════════════════════════════════════════════════════
# DevSecOps Pipeline: Build → Scan+SBOM → AI Review → AI Fix+Rescan+MR → VEX → Report → Attach
# Uses Claude Code in non-interactive (--print) mode for all AI tasks.
#
# Required CI/CD Variables (Settings → CI/CD → Variables):
#   ANTHROPIC_API_KEY        - Claude API key (Masked)
#   GITLAB_BOT_TOKEN         - Project access token with api+write_repository scope
#                              (used to push fix branch and open MR)
#   MCP_API_KEY              - API key for your MCP binary, if needed (Masked)
#   CI_REGISTRY_USER         - auto-set by GitLab
#   CI_REGISTRY_PASSWORD     - auto-set by GitLab
#
# MCP Binary (stdio mode):
#   Host path  : /opt/mcp-bins/mcp-vuln-scanner  ← place your binary here
#   In container: /opt/mcp-bins/mcp-vuln-scanner  (mounted read-only via runner config)
#   See scripts/deploy.sh for setup.
#
# Local GitLab registry access from inside Docker containers:
#   Set REGISTRY_INTERNAL_HOST = gitlab:5050 in CI/CD variables for local setup.
#   Leave empty / unset for GitLab.com (uses CI_REGISTRY automatically).
#
# Local GitLab:  http://localhost:8929
# Registry:      http://localhost:5050
# ══════════════════════════════════════════════════════════════════════════════

stages:
  - build        # Docker build + push to registry
variables:
  IMAGE_NAME:    "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  IMAGE_LATEST:  "$CI_REGISTRY_IMAGE:latest"
  IMAGE_PATCHED: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA-patched"
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  CLAUDE_CODE_VERSION: "latest"
  # For local GitLab: containers can't reach "localhost:5050" — they use the
  # Docker service name instead. Set this variable in GitLab CI/CD settings:
  #   REGISTRY_INTERNAL_HOST = gitlab:5050   (local setup)
  #   leave unset / empty    = use $CI_REGISTRY (GitLab.com or remote)
  REGISTRY_INTERNAL_HOST: ""

# ──────────────────────────────────────────────────────────────────────────────
# Reusable anchor: installs Claude Code CLI
# ──────────────────────────────────────────────────────────────────────────────
.claude-setup: &claude-setup
  image: node:20-alpine
  before_script:
    - apk add --no-cache jq curl git python3
    - npm install -g @anthropic-ai/claude-code@${CLAUDE_CODE_VERSION} --quiet
    - claude --version
  variables:
    ANTHROPIC_API_KEY: "$ANTHROPIC_API_KEY"
    CLAUDE_CODE_DISABLE_TELEMETRY: "1"

# ──────────────────────────────────────────────────────────────────────────────
# Helper: resolve the registry host reachable from inside a container
# ──────────────────────────────────────────────────────────────────────────────
.registry-host: &registry-host |
  EFFECTIVE_REGISTRY="${REGISTRY_INTERNAL_HOST:-$CI_REGISTRY}"
  echo "Using registry: ${EFFECTIVE_REGISTRY}"

# ══════════════════════════════════════════════════════════════════════════════
# STAGE 1 — Build & push image to GitLab Container Registry
# ══════════════════════════════════════════════════════════════════════════════
build-image:
  stage: build
  image: docker:24-cli
  services:
    - name: docker:24-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
  script:
    - *registry-host
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$EFFECTIVE_REGISTRY"
    - |
      docker build \
        --label "git.commit=$CI_COMMIT_SHA" \
        --label "git.branch=$CI_COMMIT_REF_NAME" \
        --label "pipeline.id=$CI_PIPELINE_ID" \
        -t "$IMAGE_NAME" \
        -t "$IMAGE_LATEST" \
        .
    - docker push "$IMAGE_NAME"
    - docker push "$IMAGE_LATEST"
    - echo "$IMAGE_NAME" > image-name.txt
    - docker inspect "$IMAGE_NAME" --format '{{.Id}}' > image-digest.txt
  artifacts:
    paths:
      - image-name.txt
      - image-digest.txt
    expire_in: 1 day

